name: Generate Contribution Snake

on:
  # Runs automatically twice per day.
  schedule:
    - cron: "0 */12 * * *"

  # Allows manual runs from the Actions tab.
  workflow_dispatch:

  # Generates the first snake soon after the profile README is pushed.
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    name: Generate neon snake animation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Uses Platane/snk to convert GitHub contributions into animated SVG files.
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: drcodersupreme
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2300FF9C&color_dots=%230B0F14,%2300473A,%2300B86B,%2300FF9C,%2300E5FF
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2300FF9C&color_dots=%230B0F14,%2300473A,%2300B86B,%2300FF9C,%2300E5FF

      # Publishes the generated SVGs to the output branch used by the README.
      - name: Push snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
